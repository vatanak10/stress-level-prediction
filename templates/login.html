<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      rel="stylesheet"
      type="text/css"
      href="{{ url_for('static', filename='styles.css') }}"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="container">
      <h2 align="center">Stress Level Prediction</h2>
      <form action="/" method="post" onsubmit="return validateForm()">
        <div class="form-group">
          <label for="depression" class="form-label">Depression (0-25):</label>
          <span id="depression_value">0</span>
          <input
            type="range"
            class="form-control"
            id="depression"
            name="depression"
            min="0"
            max="25"
            value="0"
            required
          />
        </div>
        <div class="form-group">
          <label for="anxiety_level" class="form-label">
            Anxiety Level (0-20):
          </label>
          <span id="anxiety_level_value">0</span>
          <input
            type="range"
            class="form-control"
            id="anxiety_level"
            name="anxiety_level"
            min="0"
            max="20"
            value="0"
            required
          />
        </div>

        <div class="form-group">
          <label for="headache" class="form-label">Headache (0-7):</label>
          <span id="headache_value">0</span>
          <input
            type="range"
            class="form-control"
            id="headache"
            name="headache"
            min="0"
            max="7"
            value="0"
            required
          />
        </div>
        <div class="form-group">
          <label for="sleep_quality" class="form-label"
            >Sleep Quality (0-7):</label
          >
          <span id="sleep_quality_value">0</span>
          <input
            type="range"
            class="form-control"
            id="sleep_quality"
            name="sleep_quality"
            min="0"
            max="7"
            value="0"
            required
          />
        </div>

        <div class="form-group">
          <label for="mental_health_history" class="form-label">
            Mental Health History (0-5):
          </label>
          <span id="mental_health_history_value">0</span>
          <input
            type="range"
            class="form-control"
            id="mental_health_history"
            name="mental_health_history"
            min="0"
            max="5"
            value="0"
            required
          />
        </div>

        <div class="form-group">
          <label for="breathing_problem" class="form-label">
            Breathing Problem (0-5):
          </label>
          <span id="breathing_problem_value">0</span>
          <input
            type="range"
            class="form-control"
            id="breathing_problem"
            name="breathing_problem"
            min="0"
            max="5"
            value="0"
            required
          />
        </div>
        <div class="form-group">
          <label for="living_conditions" class="form-label">
            Living Conditions (0-5):
          </label>
          <span id="living_conditions_value">0</span>
          <input
            type="range"
            class="form-control"
            id="living_conditions"
            name="living_conditions"
            min="0"
            max="5"
            value="0"
            required
          />
        </div>
        <div class="form-group">
          <label for="academic_performance" class="form-label">
            Academic Performance (0-5):
          </label>
          <span id="academic_performance_value">0</span>
          <input
            type="range"
            class="form-control"
            id="academic_performance"
            name="academic_performance"
            min="0"
            max="5"
            value="0"
            required
          />
        </div>
        <div class="form-group">
          <label for="study_load" class="form-label">Study Load (0-5):</label>
          <span id="study_load_value">0</span>
          <input
            type="range"
            class="form-control"
            id="study_load"
            name="study_load"
            min="0"
            max="5"
            value="0"
            required
          />
        </div>
        <div class="form-group">
          <label for="future_career_concerns" class="form-label"
            >Future Career Concerns (0-5):</label
          >
          <span id="future_career_concerns_value">0</span>
          <input
            type="range"
            class="form-control"
            id="future_career_concerns"
            name="future_career_concerns"
            min="0"
            max="5"
            value="0"
            required
          />
        </div>
        <div class="form-group">
          <label for="extracurricular_activities" class="form-label"
            >Extracurricular Activities (0-5):</label
          >
          <span id="extracurricular_activities_value">0</span>
          <input
            type="range"
            class="form-control"
            id="extracurricular_activities"
            name="extracurricular_activities"
            min="0"
            max="5"
            value="0"
            required
          />
        </div>
        <div class="center-button">
          <button type="submit" class="btn btn-primary">Get Result</button>
        </div>
      </form>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
